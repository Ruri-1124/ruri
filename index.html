  /* 版面概念：日本藥妝店的貨架。每個商品是一張有大圖的卡片，前三名像店頭 POP 一樣特別放大 */
  :root {

    --surface: #FFFFFF;
    --ink: #221E3A;         /* 文字：深紫墨色 */
    --muted: #6E6888;
    --line: #E6E1F7;
    --ruri: #3F5BD8;        /* 主色：瑠璃藍 */
    --ruri-soft: #E8ECFF;
    --pink: #FF5C93;        /* 收藏、POP 重點色 */
    --pink-soft: #FFE6EF;
    --gold: #F2A900; --silver: #9AA3B5; --bronze: #D98146;
    --star: #F5A623;
    --kr: #2BA98C; --kr-soft: #DDF5EE;   /* 韓國區的薄荷綠 */

    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color-scheme: light;
  }

  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ruri); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .favbtn span { color: var(--pink); }

  .filters summary { cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }

  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 500; }

  .region { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; align-items: center; }

  .region button[aria-pressed="true"] { border-color: var(--ruri); background: var(--ruri-soft); color: var(--ruri); }
  .region button.kr[aria-pressed="true"] { border-color: var(--kr); background: var(--kr-soft); color: #1A7A63; }
  .updated { margin-left: auto; font-size: 13px; color: var(--muted); }

  /* ── 頁面標題 ── */
  .head { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: end; gap: 6px 16px; }

  .count { font-size: 13px; color: var(--muted); margin: 14px 2px 10px; }

  .podium .card:nth-child(2) { border-color: var(--silver); }

  .heart svg { width: 20px; height: 20px; fill: none; stroke: var(--pink); stroke-width: 2; }
  .heart[aria-pressed="true"] svg { fill: var(--pink); }

  .brand { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 6px; }
  .flag { flex: none; font-weight: 500; }
  .nm { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rate { font-size: 12px; color: var(--muted); }
  .rate b { color: var(--star); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--pink-soft); color: #B62D61; }
  .meta { font-size: 12px; color: var(--ruri); font-weight: 700; }
  .why { font-size: 13px; color: var(--muted); }
  .bottom { margin-top: auto; padding-top: 8px; display: flex; align-items: end; justify-content: space-between; gap: 8px; }
  .price { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .price small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .buy { flex: none; text-decoration: none; background: var(--ruri); color: #fff; font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 10px; }
  .buy.oy { background: var(--kr); }
  .buy.shopee { background: #EE4D2D; }
  .buys { display: flex; flex-direction: column; align-items: stretch; gap: 4px; flex: none; }
  .alt { font-size: 12px; color: var(--muted); text-align: center; text-decoration: underline; }
  .buy:hover { filter: brightness(1.1); }
  .voices { display: grid; gap: 4px; margin-top: 4px; }
  .voice { font-size: 12px; background: var(--bg); border-radius: 8px; padding: 6px 8px; }
  .voice b { color: var(--ruri); }

  /* ── Olive Young 代碼橫幅 ── */
  .oybanner { margin-top: 16px; border-radius: 16px; background: var(--kr); color: #fff; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .oybanner b { font-family: var(--font-display); font-size: 20px; }
  .code { background: #fff; color: #1A7A63; font-weight: 900; font-size: 18px; letter-spacing: .1em; padding: 6px 14px; border-radius: 10px; font-family: ui-monospace, monospace; }
  .copy { border: 2px solid #fff; background: transparent; color: #fff; border-radius: 10px; padding: 6px 14px; cursor: pointer; font-weight: 700; }

  .sub { font-family: var(--font-display); font-weight: 900; font-size: 22px; margin: 26px 0 12px; }
  .empty { margin-top: 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 40px 20px; }
  footer { margin-top: 48px; padding-block: 24px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

  @media (max-width: 640px) {
    .logo small { display: none; }
    .favbtn em { display: none; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .podium { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .podium .card:nth-child(1) { grid-column: 1 / -1; }
    .body { padding: 10px; }
    .nm { font-size: 14px; }
    .bottom { flex-direction: column; align-items: stretch; }
    .buy { text-align: center; }
    .frow > span { width: 100%; }
    .updated { width: 100%; margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>

  // 蝦皮分潤連結：照蝦皮官方「短連結製作說明」的格式，把「蝦皮搜尋頁」包成分潤連結
  const STOP = ["OFF", "SPF", "PA", "UV", "ml", "mL", "ML", "LOT", "TV", "NEW", "SALE", "SET", "PRO", "EX", "CICA", "PDRN", "LED", "EMS", "RF", "WEB", "BOX"];
  function shopeeKeyword(p) {
    const L = LABELS[p.id];
    const brandWord = s => (s || "").split(" ")[0];
    if (L && L.brand) return (brandWord(L.brand) + " " + L.name.replace(/[（(].*?[)）]/g, "").replace(/\d+\s?(mL|ml|g|片|入|包|錠).*$/i, "")).trim();

  function shopeeLink(p) {

    if (!kw) return "";
    const origin = "https://shopee.tw/search?keyword=" + encodeURIComponent(kw);

  }

  // 分頁：source 決定資料從哪裡來

  // =========================================================
  // ② 資料
  // =========================================================
  let RANK = {}, MONTH = { groups: {}, days: 0 }, LABELS = {}, CREATORS = { items: [] }, OY = { items: [] };
  let BY_CODE = {};   // 商品代號 → 商品（給創作者推薦查圖片用）
  const state = { filtersOpen: window.innerWidth > 640, tab: "all", needs: new Set(), price: "all", sort: "rank", merge: false, cat: "all", q: "" };

  // 收藏存在瀏覽器裡（只有這台裝置看得到）
  let FAVS = {};
  try { FAVS = JSON.parse(localStorage.getItem("ruri-favs") || "{}"); } catch (e) { FAVS = {}; }
  function saveFavs() { try { localStorage.setItem("ruri-favs", JSON.stringify(FAVS)); } catch (e) {} updateFavCount(); }

  // 小工具
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const yen = n => "¥" + Number(n).toLocaleString("ja-JP");
  const twd = n => "日本價 約 NT$" + Math.round(n * JPY_TO_TWD).toLocaleString("zh-TW");
  const flag = c => ({ "日本": "日本", "韓國": "韓國" }[c] || "其他");

  function cleanName(name) {
    return name.replace(/[【［\[≪《＼★◆<＜].*?[】］\]≫》／★◆>＞]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40) || name.slice(0, 40);
  }
  function detectCountry(text) {
    if (KR_WORDS.some(w => text.includes(w))) return "韓國";
    if (OTHER_WORDS.some(w => text.includes(w))) return "其他";
    return "日本";
  }
  function needTags(text) {
    return Object.entries(NEEDS).filter(([, words]) => words.some(w => text.includes(w))).map(([tag]) => tag);
  }

  // 樂天原始資料 + 你整理的標籤 → 網站用的商品
  function toItem(raw, group) {
    const L = LABELS[raw.itemCode] || {};
    const text = raw.itemName + " " + (raw.shopName || "");
    return {
      id: raw.itemCode, group, cat: CAT[group], rank: raw.rank,
      brand: L.brand || KR_WORDS.find(w => w.length > 2 && raw.itemName.includes(w)) || raw.shopName.replace(/【.*?】|楽天市場店|楽天市場|公式|ショップ|店$/g, "").trim() || raw.shopName, name: L.name || cleanName(raw.itemName), jp: raw.itemName,
      country: L.country || detectCountry(text), tags: needTags(raw.itemName),
      price: raw.price, rating: raw.rating, reviews: raw.reviews,
      img: raw.image, url: raw.url, exclude: raw.exclude,
      daysOn: raw.daysOn, bestRank: raw.bestRank
    };
  }

  async function loadData() {
    const get = p => fetch(p, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
    const [latest, month, labels, creators, oy] = await Promise.all([
      get("data/latest.json"), get("data/month.json"), get("data/labels.json"), get("data/creators.json"), get("data/oliveyoung.json")
    ]);
    if (!latest) throw new Error("no data");
    LABELS = labels || {};
    for (const [g, items] of Object.entries(latest.groups)) RANK[g] = items.map(r => toItem(r, g)).filter(p => !p.exclude);
    if (month) { MONTH.days = month.days; for (const [g, items] of Object.entries(month.groups)) MONTH.groups[g] = items.map(r => toItem(r, g)).filter(p => !p.exclude); }
    Object.values(RANK).flat().forEach(p => { if (!BY_CODE[p.id]) BY_CODE[p.id] = p; });
    CREATORS = creators || CREATORS;
    OY = oy || OY;
    const d = new Date(latest.updated);
    document.getElementById("updated").textContent = `樂天資料更新：${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  }

  // =========================================================
  // ③ 篩選：國家 → 搜尋 → 分類 → 膚質 → 價格 → 合併品牌 → 排序
  // =========================================================
  function applyFilters(list, opts = {}) {
    let out = list;
    if (opts.japanOnly) out = out.filter(p => p.country !== "韓國");   // 韓國商品統一放在 Olive Young 分頁
    if (state.q) { const q = state.q.toLowerCase(); out = out.filter(p => (p.brand + p.name + (p.jp || "")).toLowerCase().includes(q)); }
    if (opts.catFilter && state.cat !== "all") out = out.filter(p => p.cat === state.cat);
    if (state.needs.size) out = out.filter(p => [...state.needs].every(t => (p.tags || []).includes(t)));
    if (state.price !== "all" && !opts.noPrice) {
      const [lo, hi] = state.price.split("-").map(Number);
      out = out.filter(p => p.price >= lo && p.price < hi);
    }
    if (state.merge) { const seen = new Set(); out = out.filter(p => !seen.has(p.brand) && seen.add(p.brand)); }
    const sorters = {
      rank: (a, b) => (a.rank || 99) - (b.rank || 99),
      rating: (a, b) => b.rating - a.rating,
      reviews: (a, b) => b.reviews - a.reviews,
      cheap: (a, b) => a.price - b.price,
      pricey: (a, b) => b.price - a.price
    };
    return [...out].sort(sorters[state.sort]);
  }

  // =========================================================
  // ④ 畫面
  // =========================================================
  const heartSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.6 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"></path></svg>';

  function card(p, opts = {}) {
    const fav = !!FAVS[p.id];
    const rankNo = opts.showRank ? opts.showRank : null;
    const pic = p.img
      ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">`
      : "";
    const meta = opts.meta || "";
    const [mainPrice, ...rest] = String(p.priceText || "").split("（");
    const price = p.price ? `<div class="price">${yen(p.price)}<small>${twd(p.price)}</small></div>`
      : p.priceText ? `<div class="price">${esc(mainPrice)}<small>${rest.length ? esc("（" + rest.join("（")) : "價格以官網為準"}</small></div>`
      : `<div class="price"><small>價格以官網為準</small></div>`;
    // 購買按鈕：日本商品主推「台灣蝦皮」，日本樂天放在下面；韓國精選主推 Olive Young
    const shopee = shopeeLink(p);
    const buys = p.isOY
      ? `<a class="buy oy" href="${esc(p.url)}" target="_blank" rel="sponsored noopener">去 Olive Young</a>${shopee ? `<a class="alt" href="${esc(shopee)}" target="_blank" rel="sponsored noopener">在蝦皮找找</a>` : ""}`
      : `${shopee ? `<a class="buy shopee" href="${esc(shopee)}" target="_blank" rel="sponsored noopener">在台灣蝦皮買</a>` : ""}<a class="${shopee ? "alt" : "buy"}" href="${esc(p.url)}" target="_blank" rel="sponsored noopener">${shopee ? "日本樂天看原價" : "去樂天看看"}</a>`;
    return `
      <article class="card">
        <div class="pic">
          <span class="tile">${esc(p.brand)}</span>${pic}
          ${rankNo ? `<span class="rank r${rankNo}">${rankNo}</span>` : ""}
          <button class="heart" type="button" data-fav="${esc(p.id)}" aria-pressed="${fav}" aria-label="${fav ? "從我的最愛移除" : "加入我的最愛"}">${heartSvg}</button>
        </div>
        <div class="body">
          <div class="brand"><span>${esc(p.brand)}</span><span class="flag">${flag(p.country)} ${esc(p.cat || "")}</span></div>
          <h3 class="nm" title="${esc(p.jp || p.name)}">${esc(p.name)}</h3>
          ${p.rating ? `<div class="rate"><b>★ ${p.rating.toFixed(1)}</b>（${p.reviews.toLocaleString()} 則評價）</div>` : ""}
          ${meta}
          ${p.why ? `<div class="why">${esc(p.why)}</div>` : ""}
          ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
          ${opts.extra || ""}
          <div class="bottom">${price}<div class="buys">${buys}</div></div>
        </div>
      </article>`;
  }

  function filterBar(list, opts = {}) {
    const tagsHere = [...new Set(list.flatMap(p => p.tags || []))];
    const needChips = Object.keys(NEEDS).filter(t => tagsHere.includes(t) || state.needs.has(t))
      .map(t => `<button class="chip" type="button" data-need="${t}" aria-pressed="${state.needs.has(t)}">${t}</button>`).join("");
    const cats = ["all", "彩妝", "保養", "髮品", "日用品", "美容家電"];
    const prices = [["all", "不限"], ["0-2000", "¥2,000 以下"], ["2000-5000", "¥2,000–5,000"], ["5000-10000", "¥5,000–10,000"], ["10000-9999999", "¥10,000 以上"]];
    return `
      <details class="filters" id="filters" ${state.filtersOpen ? "open" : ""}>
        <summary>篩選與排序${state.needs.size || state.price !== "all" || state.cat !== "all" ? `（已選 ${state.needs.size + (state.price !== "all") + (state.cat !== "all")} 項）` : ""}</summary>
        ${opts.catFilter ? `<div class="frow"><span>分類</span>${cats.map(c => `<button class="chip" type="button" data-cat="${c}" aria-pressed="${state.cat === c}">${c === "all" ? "全部" : c}</button>`).join("")}</div>` : ""}
        ${needChips ? `<div class="frow"><span>膚質需求</span>${needChips}</div>` : ""}
        ${opts.noPrice ? "" : `<div class="frow"><span>價格</span>${prices.map(([v, l]) => `<button class="chip" type="button" data-price="${v}" aria-pressed="${state.price === v}">${l}</button>`).join("")}</div>`}
        ${opts.noSort ? "" : `<div class="frow"><span>排序</span>
          <select id="sort" aria-label="排序方式">
            ${[["rank", "依排名"], ["rating", "評分最高"], ["reviews", "評價最多"], ["cheap", "價格低到高"], ["pricey", "價格高到低"]].map(([v, l]) => `<option value="${v}" ${state.sort === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          <label class="toggle"><input type="checkbox" id="merge" ${state.merge ? "checked" : ""}> 同品牌只看一個</label>
        </div>`}
      </details>`;
  }

  function head(page, badge) {
    return `<div class="head"><h1>${page.title}</h1>${badge || ""}</div><p style="color:var(--muted);margin:4px 0 0">${page.desc}</p>`;
  }

  function render() {
    const page = PAGES.find(p => p.key === state.tab) || PAGES[0];
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.key === page.key));
    let html = "";

    if (page.source === "rank" || page.source === "month") {
      const pool = page.source === "month" ? MONTH.groups : RANK;
      const base = page.groups.flatMap(g => pool[g] || []);
      const unique = page.catFilter ? base.filter((p, i, arr) => arr.findIndex(x => x.id === p.id) === i) : base;
      const list = applyFilters(unique, { catFilter: page.catFilter, japanOnly: true });
      const badge = page.source === "month"
        ? `<span class="src">已累積 ${MONTH.days} 天資料${MONTH.days < 30 ? "・每天增加" : ""}</span>`
        : `<span class="src">樂天真實排行</span>`;
      html += head(page, badge) + filterBar(unique, { catFilter: page.catFilter });
      const meta = p => page.source === "month" ? `<div class="meta">上榜 ${p.daysOn} / ${MONTH.days} 天・最高第 ${p.bestRank} 名</div>` : `<div class="meta">樂天第 ${p.rank} 名</div>`;
      const showRank = state.sort === "rank" && !page.catFilter && page.groups.length === 1;
      if (!list.length) {
        html += `<div class="empty">沒有符合條件的商品，試試看取消一些篩選。</div>`;
      } else if (page.podium && showRank && list.length > 3) {
        html += `<div class="podium">${list.slice(0, 3).map((p, i) => card(p, { showRank: i + 1, meta: meta(p) })).join("")}</div>`;
        html += `<p class="count">第 4 名以後・共 ${list.length} 件商品</p><div class="grid">${list.slice(3).map((p, i) => card(p, { showRank: i + 4, meta: meta(p) })).join("")}</div>`;
      } else {
        html += `<p class="count">共 ${list.length} 件商品</p><div class="grid">${list.map((p, i) => card(p, { showRank: showRank ? i + 1 : null, meta: meta(p) })).join("")}</div>`;
      }
    }

    if (page.source === "oy") {
      const items = OY.items.map((o, i) => ({ id: "oy:" + o.brand + ":" + o.name, isOY: true, brand: o.brand, name: o.name, cat: o.cat, country: "韓國", tags: o.tags, why: o.why, url: o.url, img: o.img, priceText: o.price || "", rank: i + 1, rating: 0, reviews: 0, price: 0 }));
      const list = applyFilters(items, { noPrice: true });
      html += head(page, OY.sample ? `<span class="src sample">示範資料</span>` : `<span class="src" style="background:var(--kr-soft);color:#1A7A63">Olive Young 暢銷・${esc(OY.updated || "")} 更新</span>`);
      html += OY.code
        ? `<div class="oybanner"><b>ruri 專屬優惠代碼</b><span class="code" id="oycode">${esc(OY.code)}</span><button class="copy" type="button" id="copycode">複製代碼</button>${OY.codeUrl ? `<a class="copy" style="text-decoration:none;background:#fff;color:#1A7A63" href="${esc(OY.codeUrl)}" target="_blank" rel="sponsored noopener">逛 Olive Young ↗</a>` : ""}<span>${esc(OY.codeNote)}</span></div>`
        : `<div class="oybanner"><b>Olive Young Global</b><span>韓國最大美妝通路，可直接寄送台灣。專屬優惠代碼即將公布！</span></div>`;
      html += filterBar(items, { noPrice: true, noSort: true });
      html += `<h2 class="sub">韓國人氣推薦</h2><p style="color:var(--muted);margin:-4px 0 12px">Olive Young Global 本週暢銷商品</p>`;
      html += list.length ? `<div class="grid">${list.map(p => card(p)).join("")}</div>` : `<div class="empty">沒有符合條件的商品。</div>`;
      // 日本樂天排行裡的韓國品牌，也集中放在這裡
      const seen = new Set();
      const krRakuten = applyFilters(Object.values(RANK).flat().filter(p => p.country === "韓國" && !seen.has(p.id) && seen.add(p.id)), { noPrice: true });
      if (krRakuten.length) {
        html += `<h2 class="sub">在日本也爆紅的韓系商品</h2><p style="color:var(--muted);margin:-4px 0 12px">這些韓國品牌正在日本樂天排行榜上，連結會到日本樂天</p>`;
        html += `<div class="grid">${krRakuten.map(p => card(p, { meta: `<div class="meta">樂天${esc(p.cat)}第 ${p.rank} 名</div>` })).join("")}</div>`;
      }
      html += `<p style="color:var(--muted);font-size:12px;margin-top:16px">ruri 是 Olive Young Global 的聯盟夥伴，並非 Olive Young 官方網站。</p>`;
    }

    if (page.source === "creators") {
      const items = CREATORS.items.map((c, i) => {
        const p = BY_CODE[c.itemCode];
        return p ? { ...p, creator: c, rank: i + 1 } : null;
      }).filter(Boolean);
      const list = applyFilters(items, { noPrice: true });
      html += head(page, CREATORS.sample ? `<span class="src sample">示範資料・帳號皆為範例</span>` : `<span class="src">${esc(CREATORS.week || "")}</span>`);
      html += list.length ? `<div class="grid" style="margin-top:16px">${list.map(p => card(p, {
        showRank: !state.q ? p.rank : null,
        meta: `<div class="meta">${p.creator.count} 位創作者推薦・IG ${p.creator.ig}・小紅書 ${p.creator.xhs}</div>`,
        extra: `<div class="voices">${(p.creator.voices || []).map(v => `<div class="voice"><b>${esc(v.pf)} ${esc(v.who)}</b>：${esc(v.say)}</div>`).join("")}</div>`
      })).join("")}</div>` : `<div class="empty">沒有符合條件的商品。</div>`;
    }

    if (page.source === "fav") {
      const list = applyFilters(Object.values(FAVS), { noPrice: true });
      html += head(page);
      html += list.length
        ? `<p class="count">共 ${list.length} 件收藏</p><div class="grid">${list.map(p => card(p)).join("")}</div>`
        : `<div class="empty">還沒有收藏的商品。<br>在任何商品圖片右上角點 ♥，就會出現在這裡。</div>`;
    }

    document.getElementById("view").innerHTML = html;
  }

  // =========================================================
  // ⑤ 互動
  // =========================================================
  const tabsEl = document.getElementById("tabs");
  PAGES.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.role = "tab"; b.dataset.key = p.key; b.textContent = p.label;
    b.addEventListener("click", () => { location.hash = p.key; });
    tabsEl.appendChild(b);
  });

  function fromHash() {
    const key = location.hash.slice(1);
    state.tab = PAGES.some(p => p.key === key) ? key : "all";
    state.needs.clear(); state.cat = "all"; state.price = "all";
    render();
  }
  window.addEventListener("hashchange", () => { fromHash(); window.scrollTo({ top: 0 }); });

  function findItem(id) {
    return BY_CODE[id] || Object.values(MONTH.groups).flat().find(p => p.id === id) || FAVS[id] ||
      OY.items.map(o => ({ id: "oy:" + o.brand + ":" + o.name, isOY: true, brand: o.brand, name: o.name, cat: o.cat, country: "韓國", tags: o.tags, why: o.why, url: o.url, img: o.img, priceText: o.price, price: 0, rating: 0, reviews: 0 })).find(p => p.id === id);
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
  }
  function updateFavCount() { document.getElementById("favcount").textContent = Object.keys(FAVS).length; }

  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.fav) {
      const id = t.dataset.fav;
      if (FAVS[id]) { delete FAVS[id]; toast("已從我的最愛移除"); }
      else { const p = findItem(id); if (p) { const { creator, ...snap } = p; FAVS[id] = snap; toast("已加入我的最愛 ♥"); } }
      saveFavs(); render(); return;
    }
    if (t.dataset.need) { state.needs.has(t.dataset.need) ? state.needs.delete(t.dataset.need) : state.needs.add(t.dataset.need); render(); return; }
    if (t.dataset.price) { state.price = t.dataset.price; render(); return; }
    if (t.dataset.cat) { state.cat = t.dataset.cat; render(); return; }
    if (t.id === "favjump") { location.hash = "fav"; return; }
    if (t.id === "copycode") {
      const code = OY.code;
      navigator.clipboard.writeText(code).then(() => toast("已複製代碼：" + code)).catch(() => {
        const r = document.createRange(); r.selectNodeContents(document.getElementById("oycode"));
        getSelection().removeAllRanges(); getSelection().addRange(r); toast("請按 Ctrl+C 複製");
      });
    }
  });
  document.addEventListener("toggle", e => { if (e.target.id === "filters") state.filtersOpen = e.target.open; }, true);
  document.addEventListener("change", e => {
    if (e.target.id === "sort") { state.sort = e.target.value; render(); }
    if (e.target.id === "merge") { state.merge = e.target.checked; render(); }
  });
  let qTimer;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.q = e.target.value.trim();
      if (state.q && ["oy", "creators", "fav"].includes(state.tab) === false && state.tab !== "all") { location.hash = "all"; return; }
      render();
    }, 200);
  });

  // ⑥ 開始：載入資料 → 畫出畫面
  updateFavCount();
  loadData().then(fromHash).catch(() => {
    document.getElementById("view").innerHTML = '<div class="empty">資料載入失敗，請稍後重新整理頁面。</div>';
  });
</script>
</body>
</html>
